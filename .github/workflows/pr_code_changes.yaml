# Workflow that runs on code changes to a pull request.

name: PR code changes
on:
  pull_request:
    branches:
      - main

    paths:
      - src/**
      - tests/**
      - docs/**
      - .github/workflows/pr_code_changes.yaml

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v6
        - name: Check formatting with ruff
          run: |
            pip install ruff
            ruff check --fix --exit-zero
  Test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the Hugging Face token exchange in .github/with-hf-token.sh
      id-token: write
    steps:
        - uses: actions/checkout@v6
        - name: Install uv
          uses: astral-sh/setup-uv@v8.1.0

        - name: Set up Python
          uses: actions/setup-python@v6
          with:
              python-version: '3.13'
        - name: Install dependencies
          run: |
            uv pip install -e . --system
        # Each step that reads the gated Enhanced FRS and ETB files exchanges
        # the job's GitHub OIDC token for its own one-hour, read-only token
        # from policyengine-auto's Hugging Face CI/CD identity, so no Hugging
        # Face secret is stored (https://huggingface.co/docs/hub/trusted-publishers).
        # A fork pull request has no OIDC token and runs without one.
        - name: Build data
          run: .github/with-hf-token.sh make data
          env:
            HF_OIDC_RESOURCE: policyengine-auto
            HF_OIDC_OPTIONAL: "1"
        - name: Run tests
          run: .github/with-hf-token.sh make test
          env:
            HF_OIDC_RESOURCE: policyengine-auto
            HF_OIDC_OPTIONAL: "1"
        - name: Build documentation
          run: .github/with-hf-token.sh make docs
          env:
            HF_OIDC_RESOURCE: policyengine-auto
            HF_OIDC_OPTIONAL: "1"
        - name: Check documentation build
          run: |
            for notebook in $(find docs/_build/jupyter_execute -name "*.ipynb"); do
              if grep -q '"output_type": "error"' "$notebook"; then
                echo "Error found in $notebook"
                cat "$notebook"
                exit 1
              fi
            done
