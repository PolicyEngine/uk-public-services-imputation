# Workflow that runs on code changes to a pull request.

name: Code changes 
on:
  push:
    branches:
      - main

    paths:
      - src/**
      - tests/** 
      - docs/**
      - .github/workflows/code_changes.yaml 

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v6
        - name: Check formatting with ruff
          run: |
            pip install ruff
            ruff check --fix --exit-zero
  Test:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # contents: write for the gh-pages deploy and git tag; id-token: write for
      # PyPI and for the Hugging Face token exchange in .github/with-hf-token.sh.
      contents: write
      id-token: write
    steps:
        - uses: actions/checkout@v6
        - name: Install uv
          uses: astral-sh/setup-uv@v8.1.0

        - name: Set up Python
          uses: actions/setup-python@v6
          with:
              python-version: '3.13'
        - name: Install dependencies
          run: |
            uv pip install -e ".[dev]" --system
        # Each step that reads the gated Enhanced FRS and ETB files exchanges
        # the job's GitHub OIDC token for its own one-hour, read-only token
        # from policyengine-auto's Hugging Face CI/CD identity, so no Hugging
        # Face secret is stored (https://huggingface.co/docs/hub/trusted-publishers).
        - name: Build data
          run: .github/with-hf-token.sh make data
          env:
            HF_OIDC_RESOURCE: policyengine-auto
        - name: Run tests
          run: .github/with-hf-token.sh make test
          env:
            HF_OIDC_RESOURCE: policyengine-auto
        - name: Build documentation
          run: .github/with-hf-token.sh make docs
          env:
            HF_OIDC_RESOURCE: policyengine-auto
        - name: Deploy documentation
          uses: JamesIves/github-pages-deploy-action@releases/v4
          with:
            branch: gh-pages
            folder: docs/_build/html
        - name: Build package
          run: python -m build
        - name: Publish a git tag
          run: ".github/publish-git-tag.sh || true"
        # PyPI trusted publishing: uploads accepted only from this workflow in
        # the pypi environment (limited to main). No stored token.
        - name: Publish to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1
          with:
            skip-existing: true

